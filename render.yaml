# Blueprint de Render — deja pre-armado el servicio para no tener que
# configurar cada campo a mano en el dashboard.
#
# Uso: render.com -> New -> Blueprint -> conecta este repo. Render lee este
# archivo solo (debe estar en la raíz). Las variables marcadas `sync: false`
# son secretas: Render las deja vacías y te las pide una vez, a mano, en el
# dashboard — nunca quedan en este archivo ni en el repositorio.
services:
  - type: web
    name: agroia-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      # --- Telegram ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false

      # --- LLM (OpenRouter) — Agente 1 (extracción) y Agente 3 (ventas) ---
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_MODEL
        value: minimax/minimax-m3:free

      # --- Groq — voz a texto (el productor habla) ---
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_STT_MODEL
        value: whisper-large-v3

      # --- Edge TTS — texto a voz (el bot contesta hablando) ---
      # No lleva API key. Para apagar la voz en la demo: VOZ_RESPUESTA_ACTIVA=false
      - key: VOZ_RESPUESTA_ACTIVA
        value: "true"
      - key: TTS_VOZ
        value: es-VE-SebastianNeural
      - key: TTS_VELOCIDAD
        value: "+50%"
      - key: TTS_TONO
        value: "+0Hz"

      # --- Supabase ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_TABLE_PRODUCTOS
        value: productos

      # --- App ---
      - key: APP_ENV
        value: production
      # Dominio real de Vercel una vez lo tengas — evita "*" en producción.
      - key: CORS_ALLOW_ORIGINS
        sync: false

      # --- Panel de administrador (/admin) ---
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
